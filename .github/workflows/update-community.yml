name: Actualizar muro de Azucar

on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: azucar-community-wall
  cancel-in-progress: true

jobs:
  build-wall:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar data/community.json
        id: wall
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const prefix = '[AZUCAR]';

            const normalizeReactions = (r = {}) => ({
              total_count: r.total_count || 0,
              '+1': r['+1'] || 0,
              '-1': r['-1'] || 0,
              laugh: r.laugh || 0,
              hooray: r.hooray || 0,
              confused: r.confused || 0,
              heart: r.heart || 0,
              rocket: r.rocket || 0,
              eyes: r.eyes || 0
            });

            const normalizeUser = (u = {}) => ({
              login: u.login || 'github',
              avatar_url: u.avatar_url || ''
            });

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 100
            });

            const posts = [];

            for (const issue of issues) {
              if (
                issue.pull_request ||
                !String(issue.title || '').toUpperCase().startsWith(prefix)
              ) continue;

              let comments = [];

              if (issue.comments) {
                comments = await github.paginate(
                  github.rest.issues.listComments,
                  {
                    owner,
                    repo,
                    issue_number: issue.number,
                    per_page: 100
                  }
                );
              }

              posts.push({
                number: issue.number,
                title: issue.title || '',
                body: issue.body || '',
                html_url: issue.html_url || '',
                created_at: issue.created_at,
                updated_at: issue.updated_at,
                user: normalizeUser(issue.user),
                comments: comments.length,
                reactions: normalizeReactions(issue.reactions),
                replies: comments.map(c => ({
                  id: c.id,
                  body: c.body || '',
                  html_url: c.html_url || '',
                  created_at: c.created_at,
                  updated_at: c.updated_at,
                  user: normalizeUser(c.user),
                  reactions: normalizeReactions(c.reactions)
                }))
              });
            }

            const file = 'data/community.json';

            let oldPosts = null;

            try {
              oldPosts = JSON.parse(
                fs.readFileSync(file, 'utf8')
              ).posts;
            } catch {}

            if (JSON.stringify(oldPosts) === JSON.stringify(posts)) {
              core.setOutput('changed', 'false');
              console.log('El muro ya está actualizado.');
              return;
            }

            fs.mkdirSync('data', { recursive: true });

            fs.writeFileSync(
              file,
              JSON.stringify({
                generated_at: new Date().toISOString(),
                source: 'github-actions',
                posts
              }, null, 2) + '\n'
            );

            core.setOutput('changed', 'true');
            console.log(`Muro generado con ${posts.length} mensajes.`);

      - name: Guardar muro actualizado
        if: steps.wall.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community.json
          git commit -m "Actualizar muro comunitario"
          git push
